name: yeah_music
description: "Modern cross-platform music app."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  hooks_riverpod: 2.6.1
  just_audio: 0.10.5
  just_audio_background: 0.0.1-beta.17
  audio_service: 0.18.18
  just_audio_media_kit: 2.1.0 # 桌面播放（Linux/Windows；macOS 含 DSD 等走 mpv）
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  media_kit_libs_macos_audio: any
  audio_session: 0.2.2
  permission_handler: 12.0.1
  file_picker: 10.3.2  # 用来选择目录或文件
  #  ffmpeg_kit_flutter_new: 3.2.0
  audio_metadata_reader: 1.4.2 # 读取歌曲元数据
  tray_manager: 0.5.1 # 控制托盘图标
  logger: 2.6.1
  ffi: 2.1.4
  hive: 2.2.3 # 结构化存储，比 shared_preferences 更灵活
  hive_flutter: 1.1.0 # Flutter 专用的封装层
  provider: ^6.1.5+1 # 状态管理包
  charset: ^2.0.1 # 字符集
#  disk_space_2: ^1.0.10 # 获取磁盘信息
#  system_info2: ^4.0.0 # 读取系统信息
  intl: any
  url_launcher: ^6.3.2
  device_info_plus: ^11.5.0 # 获取设备信息
  palette_generator: ^0.3.3+4 # 从图片提取颜色调色板
  shared_preferences: ^2.3.5 # 本地存储
  image_picker: ^1.1.2 # 图片选择器
  path_provider: ^2.1.5 # 沙箱内持久路径（主题背景图缓存）
  path: ^1.9.0
  characters: ^1.3.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_appauth: ^8.0.0
  visibility_detector: ^0.4.0+2
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.1
  wakelock_plus: ^1.5.2
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  crop_your_image: ^2.0.0
  record: ^6.2.0
  crypto: ^3.0.7

dependency_overrides:
  tray_manager:
    path: packages/tray_manager
  flutter_appauth:
    path: packages/flutter_appauth
  just_audio_background:
    path: packages/just_audio_background
  # Yeah Music fork：通知栏 DISPLAY_TITLE 直推、自定义 RemoteViews 等。
  audio_service:
    path: packages/audio_service

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: ^0.14.4 # 图标生成
  image: ^4.5.4 # Windows 多尺寸 .ico（tool/generate_windows_app_icon.dart）
  build_runner: ^2.4.12 #  生成 Hive TypeAdapter： flutter packages pub run build_runner build   或者 dart run build_runner build --delete-conflicting-outputs
  hive_generator: ^2.0.1

# 生成命令：dart run flutter_launcher_icons
# Windows 任务栏/托盘 .ico（runner + assets）：dart run tool/generate_windows_app_icon.dart
# 日间：白底 + yeah_music；夜间：黑底由 res/values-night/colors.xml 的 ic_launcher_background 控制。
flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: false
  image_path: "assets/icons/yeah_music.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/yeah_music1.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets: # 注册资源
    - assets/icons/
    # Hive 就绪前占位：可替换为任意 GIF（保持路径与文件名，或改 [kStartupHiveLoadingAsset]）
    - assets/launch/startup_loading.gif
